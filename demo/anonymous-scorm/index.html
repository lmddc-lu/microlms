<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>microLMS - anonymous SCORM demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f4; color: #1c1917; }
  main { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .muted { color: #78716c; font-size: 0.875rem; }
  section { background: #fff; border: 1px solid #e7e5e4; border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; }
  h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }
  form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  input[type=text] { flex: 1 1 12rem; padding: 0.4rem; }
  button { padding: 0.4rem 0.8rem; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.course { border-top: 1px solid #e7e5e4; padding: 0.75rem 0; }
  li.course:first-child { border-top: none; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .scos { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
  #error { color: #b91c1c; white-space: pre-wrap; }
  #player { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; }
  #player header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; border-bottom: 1px solid #e7e5e4; }
  #player iframe { flex: 1; border: 0; width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Anonymous SCORM demo</h1>
  <p class="muted" id="identity">Registering...</p>
  <p id="error" hidden></p>

  <section>
    <h2>Upload a SCORM package</h2>
    <form id="upload">
      <input type="text" name="title" placeholder="Course title" required>
      <input type="file" name="file" accept=".zip" required>
      <button type="submit">Upload</button>
    </form>
  </section>

  <section>
    <h2>Courses</h2>
    <ul id="courses"></ul>
    <p class="muted" id="no-courses" hidden>No course yet: upload a package above.</p>
  </section>
</main>

<div id="player" hidden>
  <header>
    <strong id="player-title"></strong>
    <button id="player-close">Back to courses</button>
  </header>
  <iframe id="player-frame" title="SCORM player"></iframe>
</div>

<script>
// Core API base; the anonymous backend's routes live under /auth
const API = "/api/v1";
// Language every package is imported as
const PACKAGE_LANG = "en";
const TOKEN_KEY = "microlms-demo-token";

let token = localStorage.getItem(TOKEN_KEY);
let me = null;

// Call the API with the anonymous token; throws with the status and body on failure
async function api(method, path, body) {
  const headers = { Authorization: `Bearer ${token}` };
  const init = { method, headers };
  if (body instanceof FormData) {
    init.body = body;
  } else if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  const response = await fetch(path, init);
  if (!response.ok) {
    throw new Error(`${method} ${path} failed with ${response.status}: ${await response.text()}`);
  }
  return response.status === 204 ? null : response.json();
}

function showError(error) {
  const element = document.getElementById("error");
  element.textContent = error.message;
  element.hidden = false;
}

function clearError() {
  document.getElementById("error").hidden = true;
}

// Reuse the stored token, or register a new anonymous learner when there is none
// or the stored one no longer resolves (e.g. after a database reset)
async function signIn() {
  if (token !== null) {
    const response = await fetch(`${API}/users/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (response.ok) {
      return response.json();
    }
    if (response.status !== 401) {
      throw new Error(`GET ${API}/users/me failed with ${response.status}: ${await response.text()}`);
    }
  }
  const response = await fetch("/auth/register", { method: "POST" });
  if (!response.ok) {
    throw new Error(`POST /auth/register failed with ${response.status}: ${await response.text()}`);
  }
  token = (await response.json()).token;
  localStorage.setItem(TOKEN_KEY, token);
  return api("GET", `${API}/users/me`);
}

function slugFor(title) {
  const base = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "course";
  return `${base}-${crypto.randomUUID().slice(0, 8)}`;
}

// Create a course in the visitor's organization, import the package into it, publish it
async function uploadPackage(title, file) {
  const course = await api("POST", `${API}/courses`, {
    slug: slugFor(title),
    title,
    description: "",
    sequential: false,
    owner_org_id: me.orgs[0].org_id,
  });
  const form = new FormData();
  form.append("file", file);
  form.append("course_id", course.id);
  form.append("lang", PACKAGE_LANG);
  await api("POST", `${API}/scorm/import`, form);
  await api("POST", `${API}/courses/${course.id}/publish`);
}

async function ensureEnrolled(courseId) {
  const enrollments = await api("GET", `${API}/enrollments/me`);
  if (!enrollments.some((enrollment) => enrollment.course_id === courseId)) {
    await api("POST", `${API}/enrollments`, { user_id: me.id, course_id: courseId });
  }
}

// The SCOs of every scorm variant of a course, in course order
async function courseScos(courseId) {
  const activities = await api("GET", `${API}/courses/${courseId}/activities`);
  const scos = [];
  for (const activity of activities) {
    for (const variant of activity.variants.filter((v) => v.module === "scorm")) {
      scos.push(...(await api("GET", `${API}/scorm/variants/${variant.id}/scos`)));
    }
  }
  return scos;
}

const playerFrame = document.getElementById("player-frame");
// Set once the player page announces it listens for the end request
let playerReady = false;
// Resolves the pending end request when the player confirms the session ended
let resolvePlayerEnded = null;

window.addEventListener("message", (event) => {
  if (event.source !== playerFrame.contentWindow || event.origin !== location.origin) return;
  if (event.data?.type === "microlms:scorm:ready") {
    playerReady = true;
  } else if (event.data?.type === "microlms:scorm:ended" && resolvePlayerEnded !== null) {
    resolvePlayerEnded();
  }
});

// Ask the player to unload the SCO, terminate the session and finish its reports,
// so the course list read next shows the final progress
function endPlayerSession() {
  if (!playerReady) {
    return Promise.resolve();
  }
  return new Promise((resolve) => {
    resolvePlayerEnded = resolve;
    playerFrame.contentWindow.postMessage({ type: "microlms:scorm:end" }, location.origin);
  });
}

async function launch(sco) {
  const { player_url } = await api("POST", `${API}/scorm/scos/${sco.id}/launch`);
  playerReady = false;
  document.getElementById("player-title").textContent = sco.title;
  playerFrame.src = player_url;
  document.getElementById("player").hidden = false;
}

async function play(course, scoList) {
  await ensureEnrolled(course.id);
  const scos = await courseScos(course.id);
  if (scos.length === 1) {
    await launch(scos[0]);
    return;
  }
  scoList.replaceChildren(
    ...scos.map((sco) => {
      const button = document.createElement("button");
      button.textContent = sco.title;
      button.addEventListener("click", () => launch(sco).catch(showError));
      return button;
    }),
  );
}

function statusText(enrollment) {
  if (enrollment === undefined) {
    return "Not enrolled";
  }
  if (enrollment.status === "completed") {
    return "Completed";
  }
  return `In progress, ${Math.round(enrollment.progress * 100)}%`;
}

async function renderCourses() {
  const [courses, enrollments] = await Promise.all([
    api("GET", `${API}/courses`),
    api("GET", `${API}/enrollments/me`),
  ]);
  const byCourse = new Map(enrollments.map((enrollment) => [enrollment.course_id, enrollment]));
  const list = document.getElementById("courses");
  list.replaceChildren(
    ...courses.map((course) => {
      const enrollment = byCourse.get(course.id);
      const item = document.createElement("li");
      item.className = "course";
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = course.title;
      const status = document.createElement("div");
      status.className = "muted";
      status.textContent = statusText(enrollment);
      label.append(title, status);
      const button = document.createElement("button");
      button.textContent = "Play";
      const scoList = document.createElement("div");
      scoList.className = "scos";
      button.addEventListener("click", () => {
        clearError();
        play(course, scoList).catch(showError);
      });
      row.append(label, button);
      item.append(row, scoList);
      return item;
    }),
  );
  document.getElementById("no-courses").hidden = courses.length > 0;
}

document.getElementById("upload").addEventListener("submit", async (event) => {
  event.preventDefault();
  clearError();
  const form = event.target;
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    await uploadPackage(form.title.value.trim(), form.file.files[0]);
    form.reset();
    await renderCourses();
  } catch (error) {
    showError(error);
  } finally {
    button.disabled = false;
  }
});

document.getElementById("player-close").addEventListener("click", async () => {
  await endPlayerSession();
  resolvePlayerEnded = null;
  playerFrame.src = "about:blank";
  document.getElementById("player").hidden = true;
  renderCourses().catch(showError);
});

signIn()
  .then((user) => {
    me = user;
    document.getElementById("identity").textContent =
      `Anonymous learner ${me.id} in ${me.orgs[0].name}. The token is kept in this browser.`;
    return renderCourses();
  })
  .catch(showError);
</script>
</body>
</html>
