# Demo chain (branch label "demo") plus the core chain shipped inside the
# installed microlms package. `alembic upgrade heads` applies both.
[alembic]
script_location = migrations
version_locations = migrations/versions microlms:db/migrations/versions
path_separator = space
# Leave empty: env.py falls back to MICROLMS_DATABASE_URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
