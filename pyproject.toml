[project]
name = "microlms-core"
version = "0.1.0"
description = "Reusable micro-LMS core: FastAPI app factory with pluggable auth, storage, event hooks and optional content modules (SCORM, CMI5, H5P, LTI)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Nathan Lenas", email = "nathan.lenas@lmddc.lu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16",
    "psycopg>=3.2",
]

[project.optional-dependencies]
# OAuth2 password flow with signed JWT access tokens (microlms.auth.jwt)
jwt = [
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
]
# cmi5 content module: package upload (multipart) and server-side xAPI client
cmi5 = [
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
# scorm content module: package upload (multipart) and server-side xAPI client
scorm = [
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
# h5p content module: package upload (multipart) and server-side xAPI client
h5p = [
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
# lti module: RS256 signing and verification, token endpoint forms and tool
# key set fetching
lti = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
]
# xapi ingestion module: server-side xAPI client for external statement sources
xapi = [
    "httpx>=0.27",
]
oidc = [
    "authlib>=1.6",
    "httpx>=0.27",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=8.0",
    "ruff>=0.15.21",
    "testcontainers[postgres]>=4.15.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# Distribution is "microlms-core" but the importable module is "microlms"
[tool.uv.build-backend]
module-name = "microlms"

[tool.ruff]
target-version = "py313"
line-length = 100
# Autogenerated Alembic revisions are templated, not hand-written
extend-exclude = ["src/microlms/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
