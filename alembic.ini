# Alembic config for developing the core migration chain.
# Client projects use their own alembic.ini and add the packaged chain via
# version_locations (see README).

[alembic]
# Package resource syntax: migrations ship inside the installed package
script_location = microlms:db/migrations
path_separator = os

# Leave empty: env.py falls back to MICROLMS_DATABASE_URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
